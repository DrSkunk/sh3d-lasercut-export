name: Auto-approve workflow runs from maintainers

on:
  workflow_run:
    workflows: ["Build Plugin (PR)"]
    types: [requested]

permissions:
  actions: write

jobs:
  auto-approve:
    name: Approve if actor is a maintainer
    runs-on: ubuntu-latest

    steps:
      - name: Approve workflow run for maintainers
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.workflow_run.actor.login;

            let permission;
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor
              });
              permission = response.data.permission;
            } catch (error) {
              console.log(`Could not retrieve permission for ${actor}: ${error.message}`);
              return;
            }

            if (['admin', 'write'].includes(permission)) {
              await github.rest.actions.approveWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id
              });
              console.log(`Auto-approved workflow run for maintainer: ${actor} (permission: ${permission})`);
            } else {
              console.log(`Skipping auto-approve for ${actor} (permission: ${permission})`);
            }
