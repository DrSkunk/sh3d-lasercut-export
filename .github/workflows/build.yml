name: Build Plugin (PR)

on:
  pull_request:

permissions:
  contents: read

env:
  SH3D_VERSION: "7.5"
  SH3D_JAR_URL: "https://downloads.sourceforge.net/project/sweethome3d/SweetHome3D/SweetHome3D-7.5/SweetHome3D-7.5.jar"

jobs:
  build:
    name: Build plugin artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Cache Sweet Home 3D jar
        id: cache-sh3d-jar
        uses: actions/cache@v4
        with:
          path: lib/SweetHome3D.jar
          key: ${{ runner.os }}-sh3d-jar-${{ env.SH3D_VERSION }}

      - name: Download Sweet Home 3D jar
        if: steps.cache-sh3d-jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p lib
          curl -fL "${SH3D_JAR_URL}" -o lib/SweetHome3D.jar

      - name: Build plugin
        run: ant -Dsh3d.jar=lib/SweetHome3D.jar package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LasercutExport-sh3p
          path: dist/LasercutExport.sh3p
          if-no-files-found: error
